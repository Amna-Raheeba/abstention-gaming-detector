[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abstention-gaming-detector"
version = "0.1.0"
description = "Detects label-aware (gamed) abstention in selective-prediction logs with a confidence-conditional permutation test, and reconstructs the honest selective accuracy at matched coverage."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
